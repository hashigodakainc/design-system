name: Validate design system

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Enable Corepack
        run: corepack enable
      - name: Rebuild generated files from tokens
        run: node scripts/build-tokens.mjs
      - name: Generated files must be up to date
        run: git diff --exit-code styles/tokens.css styles/typography.css
      - name: Rebuild favicon from brand motif
        run: node scripts/build-favicon.mjs
      - name: Generated favicon must be up to date
        run: git diff --exit-code assets/icons/favicon.svg
      - name: Validate tokens, assets, and docs
        run: node scripts/validate-tokens.mjs
      - name: Verify resolved visual compatibility
        run: node scripts/validate-visual-compatibility.mjs
      - name: Install design system site dependencies
        run: pnpm install --frozen-lockfile
        working-directory: site
      - name: Verify design system site deployment bundle
        run: pnpm verify
        working-directory: site
      - name: Install MCP dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mcp
      - name: Build MCP server
        run: pnpm build
        working-directory: mcp
      - name: Rebuild wordmark
        run: pnpm build:wordmark
        working-directory: mcp
      - name: Test MCP Worker
        run: pnpm test
        working-directory: mcp
      - name: Generated wordmark files must be up to date
        run: git diff --exit-code assets/wordmarks/wordmark.svg assets/manifest.json
