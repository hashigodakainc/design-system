name: Validate design system

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Rebuild generated files from tokens
        run: node scripts/build-tokens.mjs
      - name: Generated files must be up to date
        run: git diff --exit-code styles/tokens.css styles/typography.css
      - name: Validate tokens, assets, and docs
        run: node scripts/validate-tokens.mjs
      - name: Install guideline site dependencies
        run: pnpm install --frozen-lockfile
        working-directory: site
      - name: Verify guideline site deployment bundle
        run: pnpm verify
        working-directory: site
      - name: Install MCP dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mcp
      - name: Build MCP server
        run: pnpm build
        working-directory: mcp
      - name: Rebuild wordmark
        run: pnpm build:wordmark
        working-directory: mcp
      - name: Test MCP Worker
        run: pnpm test
        working-directory: mcp
      - name: Generated wordmark files must be up to date
        run: git diff --exit-code assets/wordmarks/wordmark.svg assets/manifest.json
