name: Deploy design system MCP

on:
  push:
    branches: [main]
    paths:
      - "assets/**"
      - "docs/**"
      - "mcp/**"
      - "styles/**"
      - "tokens/**"
      - ".github/workflows/deploy-mcp.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-design-system-mcp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out design system
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate deployment configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN is not configured' >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'CLOUDFLARE_ACCOUNT_ID is not configured' >&2; exit 1; }

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mcp/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: mcp
        run: pnpm install --frozen-lockfile

      - name: Validate Worker bundle
        working-directory: mcp
        run: |
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Deploy Worker
        working-directory: mcp
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WRANGLER_LOG_PATH: /tmp/design-system-mcp-wrangler-deploy.log
        run: pnpm exec wrangler deploy --tag design-system-snapshot --message "design-system:${{ github.sha }}"

      - name: Verify remote MCP
        working-directory: mcp
        env:
          MCP_BASE_URL: https://mcp-design.hashigodaka.co.jp
        run: |
          for attempt in 1 2 3 4 5; do
            if pnpm smoke:remote; then
              exit 0
            fi
            if [[ "$attempt" -lt 5 ]]; then
              sleep 10
            fi
          done
          exit 1

      - name: Write deployment summary
        run: |
          {
            echo '### Design system MCP deployment'
            echo
            echo '- Commit: `${{ github.sha }}`'
            echo '- Endpoint: `https://mcp-design.hashigodaka.co.jp/mcp`'
            echo '- Remote smoke: passed'
          } >> "$GITHUB_STEP_SUMMARY"
