<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <filter id="grain-feather" x="-8%" y="-8%" width="116%" height="116%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="soft-edge"/>
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.62"
      numOctaves="2"
      seed="29"
      result="noise"
    />
    <feComposite in="noise" in2="soft-edge" operator="in" result="noisy-edge"/>
    <feComponentTransfer in="noisy-edge" result="feather">
      <feFuncA type="linear" slope="1.45" intercept="-0.34"/>
    </feComponentTransfer>
    <feMerge>
      <feMergeNode in="feather"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <path
    fill="#000"
    filter="url(#grain-feather)"
    d="M44 42Q40 42 40 47v162q0 6 5 3l57-33q12-7 12-26 0-17 14-17t14 17q0 19 12 26l57 33q5 3 5-3V47q0-5-4-5l-58 33q-12 7-12 26 0 19-14 19t-14-19q0-19-12-26Z"
  />
</svg>
