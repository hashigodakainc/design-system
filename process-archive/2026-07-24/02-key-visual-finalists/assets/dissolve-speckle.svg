<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="speckle" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.34" numOctaves="2" seed="37" result="noise"/>
    <feComponentTransfer in="noise" result="threshold">
      <feFuncA type="discrete" tableValues="0 0 0 0 0.18 0.55 0.9"/>
    </feComponentTransfer>
    <feFlood flood-color="#FAF9FC" result="color"/>
    <feComposite in="color" in2="threshold" operator="in"/>
  </filter>
  <rect width="180" height="180" filter="url(#speckle)"/>
</svg>
