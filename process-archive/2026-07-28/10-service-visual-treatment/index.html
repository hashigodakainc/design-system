<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service visual treatment round 07</title>
  <style>
    :root {
      color-scheme: light;
      --hero: #eef7fc;
      --canvas: #faf9fc;
      --ink: #18151d;
      --muted: #625d69;
      --line: #dcd8e1;
      --primary: #00a0ff;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: #dedce2;
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", sans-serif;
    }
    .toolbar {
      position: fixed;
      inset: 20px auto auto 50%;
      z-index: 10;
      display: flex;
      gap: 6px;
      padding: 7px;
      background: rgb(250 249 252 / 92%);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 10px 34px rgb(24 21 29 / 13%);
      backdrop-filter: blur(16px);
      transform: translateX(-50%);
    }
    .toolbar::before {
      content: "比較用・実装外";
      align-self: center;
      padding: 0 10px 0 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .06em;
      white-space: nowrap;
    }
    .toolbar a {
      min-width: 68px;
      padding: 11px 16px;
      color: var(--ink);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      text-decoration: none;
      border: 1px solid transparent;
      border-radius: 10px;
    }
    .toolbar a:hover,
    .toolbar a:focus-visible {
      color: var(--primary);
      background: var(--hero);
      border-color: color-mix(in srgb, var(--primary) 34%, transparent);
      outline: none;
    }
    .variant {
      display: none;
      min-height: 100vh;
      padding: 90px 24px 48px;
    }
    .variant:target { display: block; }
    .variant:first-of-type { display: block; }
    body:has(.variant:target) .variant:first-of-type:not(:target) { display: none; }
    .board {
      width: min(100%, 1440px);
      margin: 0 auto;
      overflow: hidden;
      background: var(--hero);
      box-shadow: 0 22px 70px rgb(24 21 29 / 16%);
    }
    .board img {
      display: block;
      width: 100%;
      height: auto;
    }
    .caption {
      width: min(100%, 1440px);
      margin: 0 auto;
      padding: 18px 22px 0;
      color: #4f4a55;
      font-size: 13px;
      line-height: 1.7;
    }
    .caption strong {
      color: var(--ink);
      font-size: 15px;
    }
    @media (max-width: 720px) {
      .toolbar {
        inset: auto 12px 12px;
        justify-content: center;
        transform: none;
      }
      .toolbar::before { display: none; }
      .toolbar a { min-width: 58px; padding-inline: 12px; }
      .variant { padding: 24px 0 96px; }
      .caption { padding-inline: 18px; }
    }
  </style>
</head>
<body>
  <nav class="toolbar" aria-label="比較案">
    <a href="#A">A</a>
    <a href="#B">B</a>
    <a href="#C">C</a>
    <a href="#C2">C2</a>
  </nav>

  <section class="variant" id="A">
    <div class="board"><img src="assets/variant-a.png" alt="A案 編集的グリッド"></div>
    <p class="caption"><strong>A / Editorial grid</strong><br>線、余白、文字組の精度で情報の強弱をつくる静かな方向。</p>
  </section>

  <section class="variant" id="B">
    <div class="board"><img src="assets/variant-b.png" alt="B案 オープンタイポグラフィ"></div>
    <p class="caption"><strong>B / Open typography</strong><br>面を減らし、タイポグラフィと独立したアイコンの位置関係で流れをつくる方向。</p>
  </section>

  <section class="variant" id="C">
    <div class="board"><img src="assets/variant-c.png" alt="C案 ブランドカラーフィールド"></div>
    <p class="caption"><strong>C / Brand color fields</strong><br>低濃度の大判色面と切り取りで、縦スクロールに編集リズムをつくる方向。</p>
  </section>

  <section class="variant" id="C2">
    <div class="board"><img src="assets/variant-c2.png" alt="C2案 背景図形なし"></div>
    <p class="caption"><strong>C2 / Quiet color fields</strong><br>Cの構造を保ち、背景の抽象図形を外して、色を情報面と境界だけに限定した方向。</p>
  </section>
</body>
</html>
