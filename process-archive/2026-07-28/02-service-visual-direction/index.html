<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Service visual comparison</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00a0ff;
      --secondary: #c7f14a;
      --violet: #6c4ed9;
      --canvas: #faf9fc;
      --ink: #18151d;
      --muted: #625d69;
      --border: #dcd8e1;
      --hero: color-mix(in srgb, var(--primary) 5%, var(--canvas));
      --gutter: clamp(40px, 4vw, 72px);
      --heading: "Sora", sans-serif;
      --body: "LINE Seed JP", "Noto Sans JP", sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--hero); scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--hero); font-family: var(--body); -webkit-font-smoothing: antialiased; }
    button { font: inherit; }
    .variant { display: none; min-height: 100svh; background: var(--hero); overflow: hidden; }
    .variant.is-active { display: block; }
    .shell { min-height: 100svh; padding: clamp(82px, 9vh, 120px) var(--gutter) clamp(100px, 11vh, 140px); }
    .section-heading h1 { margin: 0; font-family: var(--heading); font-size: clamp(52px, 6.3vw, 88px); line-height: .98; letter-spacing: -.055em; }
    .section-heading p { margin: 14px 0 0; color: var(--muted); font-size: 15px; }
    .service-name { margin: 0; font-size: clamp(21px, 2vw, 29px); line-height: 1.45; letter-spacing: -.025em; font-weight: 700; }
    .service-description { margin: 18px 0 0; color: var(--muted); font-size: clamp(14px, 1.12vw, 16px); line-height: 1.85; }
    .icon { display: block; color: var(--accent); }
    .icon svg { display: block; width: 100%; height: 100%; overflow: visible; }
    .icon path, .icon rect, .icon circle, .icon line, .icon polyline { vector-effect: non-scaling-stroke; }

    /* A: parallel columns */
    .variant-a .shell { display: grid; grid-template-rows: auto 1fr; gap: clamp(66px, 8vh, 104px); }
    .variant-a .services { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); }
    .variant-a .service { min-width: 0; padding: 38px clamp(24px, 3.3vw, 48px) 0 0; position: relative; }
    .variant-a .service + .service { border-left: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); padding-left: clamp(24px, 3.3vw, 48px); }
    .variant-a .service:last-child { padding-right: 0; }
    .variant-a .icon { width: clamp(96px, 10vw, 148px); aspect-ratio: 1; margin-bottom: clamp(34px, 5vh, 58px); }
    .variant-a .service::before { content: ""; position: absolute; top: -2px; left: 0; width: 38px; height: 4px; background: var(--accent); }
    .variant-a .service + .service::before { left: clamp(24px, 3.3vw, 48px); }

    /* B: editorial ledger */
    .variant-b .shell { display: grid; grid-template-columns: minmax(240px, 31%) 1fr; gap: clamp(44px, 7vw, 112px); align-items: start; }
    .variant-b .section-heading { position: sticky; top: 80px; }
    .variant-b .services { border-top: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); }
    .variant-b .service { --row-icon: clamp(78px, 7.2vw, 112px); display: grid; grid-template-columns: var(--row-icon) minmax(200px, .75fr) minmax(270px, 1fr); gap: clamp(24px, 3vw, 48px); align-items: center; min-height: clamp(176px, 22vh, 226px); border-bottom: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); }
    .variant-b .icon { width: var(--row-icon); height: var(--row-icon); }
    .variant-b .service-description { margin: 0; }
    .variant-b .service-name { font-size: clamp(20px, 2vw, 30px); }

    /* C: typographic field */
    .variant-c .shell { position: relative; }
    .variant-c .section-heading { position: relative; z-index: 2; }
    .variant-c .services { margin-top: clamp(52px, 7vh, 88px); display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(2, minmax(220px, 27vh)); gap: 22px 18px; }
    .variant-c .service { position: relative; z-index: 1; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 22px 24px 0; border-bottom: 1px solid color-mix(in srgb, var(--ink) 18%, transparent); }
    .variant-c .service:nth-child(1) { grid-column: 1 / span 5; grid-row: 1; }
    .variant-c .service:nth-child(2) { grid-column: 7 / span 6; grid-row: 1; }
    .variant-c .service:nth-child(3) { grid-column: 4 / span 6; grid-row: 2; }
    .variant-c .icon { position: absolute; width: clamp(148px, 16vw, 238px); height: clamp(148px, 16vw, 238px); right: 0; top: 50%; transform: translateY(-62%); opacity: .18; }
    .variant-c .service-name { position: relative; z-index: 1; max-width: 390px; font-size: clamp(24px, 2.35vw, 36px); }
    .variant-c .service-description { position: relative; z-index: 1; max-width: 520px; }
    .variant-c .service::after { content: ""; position: absolute; left: 0; bottom: -2px; width: clamp(52px, 7vw, 100px); height: 4px; background: var(--accent); }

    .compare-ui { position: fixed; right: 18px; bottom: 18px; z-index: 50; width: min(510px, calc(100vw - 36px)); padding: 12px; border: 1px solid rgba(24,21,29,.14); border-radius: 16px; background: rgba(250,249,252,.9); box-shadow: 0 14px 40px rgba(24,21,29,.12); backdrop-filter: blur(18px); }
    .compare-ui__label { margin: 0 0 8px; padding-left: 3px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .compare-ui__buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .compare-ui button { border: 1px solid var(--border); border-radius: 10px; padding: 10px 11px; color: var(--ink); background: var(--canvas); text-align: left; cursor: pointer; }
    .compare-ui button[aria-pressed="true"] { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: color-mix(in srgb, var(--primary) 8%, var(--canvas)); }
    .compare-ui button strong { display: block; font-family: var(--heading); font-size: 16px; }
    .compare-ui button span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; line-height: 1.35; }

    @media (max-width: 820px) {
      :root { --gutter: 24px; }
      .shell { padding-top: 74px; padding-bottom: 150px; }
      .variant-a .shell { display: block; }
      .variant-a .services { display: block; margin-top: 54px; }
      .variant-a .service, .variant-a .service + .service { display: grid; grid-template-columns: 76px 1fr; column-gap: 20px; padding: 26px 0 34px; border-left: 0; border-bottom: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); }
      .variant-a .icon { width: 72px; margin: 0; grid-row: 1 / span 2; }
      .variant-a .service::before, .variant-a .service + .service::before { left: 0; top: -2px; }
      .variant-a .service-description { margin-top: 10px; }

      .variant-b .shell { display: block; }
      .variant-b .section-heading { position: static; }
      .variant-b .services { margin-top: 54px; }
      .variant-b .service { grid-template-columns: 66px 1fr; gap: 18px; min-height: 0; padding: 26px 0 30px; }
      .variant-b .service-description { grid-column: 2; margin-top: -5px; }
      .variant-b .icon { width: 64px; height: 64px; }

      .variant-c .services { display: block; margin-top: 54px; }
      .variant-c .service, .variant-c .service:nth-child(n) { min-height: 230px; margin-bottom: 28px; padding-right: 0; }
      .variant-c .icon { width: 170px; height: 170px; opacity: .13; transform: translateY(-60%); }
      .compare-ui { left: 12px; right: 12px; bottom: 12px; width: auto; }
      .compare-ui button { padding: 9px; }
      .compare-ui button span { display: none; }
    }
  </style>
</head>
<body>
  <template id="icon-build">
    <svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <path d="M13 78V32l35-20v45L13 78Z" fill="currentColor" opacity=".17"/>
      <path d="M72 40 107 20v45L72 86V40Z" fill="currentColor" opacity=".4"/>
      <path d="M13 78 48 57l24 29 35-21v18l-35 24-24-30-35 20V78Z" fill="currentColor"/>
      <path d="m48 57 24-17M48 77l24-17" stroke="currentColor" stroke-width="3"/>
    </svg>
  </template>
  <template id="icon-team">
    <svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <circle cx="34" cy="36" r="18" fill="currentColor" opacity=".25"/>
      <circle cx="86" cy="36" r="18" fill="currentColor" opacity=".55"/>
      <path d="M15 101V76c0-13 8-23 19-23s19 10 19 23v25H15Z" fill="currentColor" opacity=".5"/>
      <path d="M67 101V76c0-13 8-23 19-23s19 10 19 23v25H67Z" fill="currentColor"/>
      <path d="M44 73h32M52 65l-8 8 8 8M68 65l8 8-8 8" stroke="currentColor" stroke-width="4"/>
    </svg>
  </template>
  <template id="icon-flow">
    <svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
      <rect x="11" y="17" width="38" height="29" rx="4" fill="currentColor" opacity=".32"/>
      <rect x="71" y="74" width="38" height="29" rx="4" fill="currentColor"/>
      <path d="M49 31h25c14 0 25 11 25 25v18M71 89H46c-14 0-25-11-25-25V46" stroke="currentColor" stroke-width="5"/>
      <path d="m90 66 9 9 9-9M30 54l-9-9-9 9" stroke="currentColor" stroke-width="5"/>
      <circle cx="60" cy="60" r="12" fill="currentColor" opacity=".55"/>
    </svg>
  </template>

  <main>
    <section class="variant variant-a" data-variant="A" aria-label="案A 並列カラム">
      <div class="shell">
        <header class="section-heading"><h1>Service</h1><p>サービス</p></header>
        <div class="services" data-services></div>
      </div>
    </section>
    <section class="variant variant-b" data-variant="B" aria-label="案B エディトリアルリスト">
      <div class="shell">
        <header class="section-heading"><h1>Service</h1><p>サービス</p></header>
        <div class="services" data-services></div>
      </div>
    </section>
    <section class="variant variant-c" data-variant="C" aria-label="案C タイポグラフィフィールド">
      <div class="shell">
        <header class="section-heading"><h1>Service</h1><p>サービス</p></header>
        <div class="services" data-services></div>
      </div>
    </section>
  </main>

  <aside class="compare-ui" aria-label="比較用・実装外">
    <p class="compare-ui__label">比較用・実装外</p>
    <div class="compare-ui__buttons">
      <button type="button" data-select="A"><strong>A</strong><span>並列カラム</span></button>
      <button type="button" data-select="B"><strong>B</strong><span>エディトリアルリスト</span></button>
      <button type="button" data-select="C"><strong>C</strong><span>タイポグラフィフィールド</span></button>
    </div>
  </aside>

  <script>
    const services = [
      {
        title: "AIを活用した<br>システム開発",
        description: "新しいサービスや業務システムの開発、既存システムの改善を、要件整理から設計・実装・品質保証まで一貫して担います。AIを開発プロセスに組み込み、変化へ継続的に対応できるシステムを届けます。",
        icon: "icon-build",
        accent: "var(--primary)"
      },
      {
        title: "社内AI開発体制の<br>構築支援",
        description: "自社の担当者がAIを活用してシステムを開発・改善できるよう、開発環境、進め方、品質管理の仕組みを整えます。実案件を共に進めながら、継続的に開発できる体制を社内につくります。",
        icon: "icon-team",
        accent: "var(--secondary)"
      },
      {
        title: "業務への<br>AI導入支援",
        description: "実際の業務を起点に、AIを使った業務フローや自動化を設計・実装します。ツール導入や研修で終わらせず、現場で使われ、改善が続く状態まで支援します。",
        icon: "icon-flow",
        accent: "var(--violet)"
      }
    ];

    document.querySelectorAll("[data-services]").forEach((container) => {
      services.forEach((service) => {
        const article = document.createElement("article");
        article.className = "service";
        article.style.setProperty("--accent", service.accent);
        const icon = document.createElement("div");
        icon.className = "icon";
        icon.append(document.getElementById(service.icon).content.cloneNode(true));
        const title = document.createElement("h2");
        title.className = "service-name";
        title.innerHTML = service.title;
        const description = document.createElement("p");
        description.className = "service-description";
        description.textContent = service.description;
        article.append(icon, title, description);
        container.append(article);
      });
    });

    function selectVariant(id) {
      const selected = ["A", "B", "C"].includes(id) ? id : "A";
      document.querySelectorAll(".variant").forEach((section) => {
        section.classList.toggle("is-active", section.dataset.variant === selected);
      });
      document.querySelectorAll("[data-select]").forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.select === selected));
      });
      if (location.hash !== `#${selected}`) history.replaceState(null, "", `#${selected}`);
    }
    document.querySelectorAll("[data-select]").forEach((button) => {
      button.addEventListener("click", () => selectVariant(button.dataset.select));
    });
    window.addEventListener("hashchange", () => selectVariant(location.hash.slice(1)));
    selectVariant(location.hash.slice(1) || "A");
  </script>
</body>
</html>
