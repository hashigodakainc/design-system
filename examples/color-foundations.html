<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hashigodaka color foundations</title>
  <link rel="stylesheet" href="../styles/tokens.css">
  <style>
    * { box-sizing:border-box; }
    body { margin:0; color:var(--hsg-color-text-primary); background:var(--hsg-color-background-canvas); font-family:system-ui,sans-serif; }
    main { width:min(1120px,calc(100% - 32px)); margin:auto; padding:72px 0; }
    header { display:grid; grid-template-columns:1fr auto; gap:32px; align-items:end; margin-bottom:72px; }
    h1 { max-width:760px; margin:0; font-size:clamp(44px,7vw,96px); line-height:.98; letter-spacing:-.065em; }
    header p { max-width:280px; margin:0; line-height:1.7; }
    .actions { display:flex; gap:10px; margin-top:28px; }
    .button { display:inline-flex; min-height:48px; align-items:center; padding:0 18px; color:var(--hsg-color-action-primary-foreground); background:var(--hsg-color-action-primary-background); font-weight:750; text-decoration:none; }
    .button.secondary { color:var(--hsg-color-action-secondary-foreground); background:var(--hsg-color-action-secondary-background); }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; }
    .card { padding:28px; background:var(--hsg-color-background-surface); }
    .card h2 { margin:0 0 10px; font-size:24px; }
    .card p { margin:0; line-height:1.7; }
    .series { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; height:180px; align-items:end; margin-top:28px; }
    .series i { display:block; min-height:36px; background:var(--hsg-color-data-series-1); }
    .series i:nth-child(2) { height:72%; background:var(--hsg-color-data-series-2); }
    .series i:nth-child(3) { height:90%; background:var(--hsg-color-data-series-3); }
    .series i:nth-child(4) { height:62%; background:var(--hsg-color-data-series-4); }
    .tokens { display:grid; grid-template-columns:repeat(7,1fr); margin-top:16px; border:1px solid var(--hsg-color-border-subtle); }
    .tokens i { min-height:88px; }
    .tokens i:nth-child(1) { background:var(--hsg-color-brand-primary); }
    .tokens i:nth-child(2) { background:var(--hsg-color-brand-secondary); }
    .tokens i:nth-child(3) { background:var(--hsg-color-brand-extended-violet); }
    .tokens i:nth-child(4) { background:var(--hsg-color-brand-extended-orange); }
    .tokens i:nth-child(5) { background:var(--hsg-color-neutral-canvas); }
    .tokens i:nth-child(6) { background:var(--hsg-color-neutral-ink); }
    .tokens i:nth-child(7) { background:var(--hsg-color-neutral-surface); }
    @media (max-width:720px) { header,.grid { grid-template-columns:1fr; } .tokens { grid-template-columns:repeat(4,1fr); } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>事業の要求を、出荷できるソフトウェアへ。</h1>
        <div class="actions"><a class="button" href="#">相談する</a><a class="button secondary" href="#">支援領域を見る</a></div>
      </div>
      <p>人間味のある力強さと、B2Bの依頼先としての精密さを両立するカラースキームの実装見本です。</p>
    </header>
    <section class="grid">
      <article class="card"><h2>プロダクト開発</h2><p>技術設計から実装、テスト、リリースまで、成果の出荷に責任を持ちます。</p></article>
      <article class="card"><h2>色は意味のある箇所へ</h2><p>白に近い背景を広く取り、鮮やかな色はCTA、図解、グラフィックへ限定します。</p></article>
    </section>
    <div class="series" aria-label="Primary、Secondary、Extended Colorsの使用例"><i></i><i></i><i></i><i></i></div>
    <div class="tokens" aria-label="D-E-Dカラーパレット"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </main>
</body>
</html>
